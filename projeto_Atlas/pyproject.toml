# ═══════════════════════════════════════════════════════════════
#  Atlas — configuração do projeto
#  Módulo 04 · PEP 621
#
#  Este arquivo substitui o requirements.txt e centraliza TUDO:
#  metadados, dependências, e configuração de todas as ferramentas.
#
#  Instalação editável (desenvolvimento):
#      pip install -e ".[dev]"
#
#  "Editável" (-e) cria um link para o código-fonte em vez de copiá-lo.
#  Você edita e a mudança vale na hora, sem reinstalar.
# ═══════════════════════════════════════════════════════════════

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


# ═══════════════════════════════════════════════════════════════
#  Metadados
# ═══════════════════════════════════════════════════════════════
