# ═══════════════════════════════════════════════════════════════
#  Atlas — proxy reverso (Módulo 09)
#
#  Instalar:
#      sudo cp infra/nginx.conf /etc/nginx/sites-available/atlas
#      sudo ln -s /etc/nginx/sites-available/atlas /etc/nginx/sites-enabled/
#      sudo nginx -t          🔑 SEMPRE antes do reload
#      sudo systemctl reload nginx
#
#  🔴 `nginx -t` antes de TODO reload. Um erro de sintaxe no reload
#     derruba o site — e você fica sem o proxy justamente para
#     descobrir o que aconteceu.
#
#  💭 POR QUE UM PROXY, SE O UVICORN JÁ SERVE HTTP?
#
#     O motivo mais concreto é o CLIENTE LENTO: alguém numa conexão
#     ruim leva 30 segundos para enviar o corpo. Sem proxy, isso ocupa
#     um worker seu por 30 segundos. Com 4 workers, bastam 4 clientes
#     lentos para derrubar a API — e isso é tanto um ataque conhecido
#     (slowloris) quanto uma situação cotidiana em 3G.
#
#     O Nginx absorve a lentidão e só entrega ao seu worker quando a
#     requisição está inteira.
# ═══════════════════════════════════════════════════════════════

upstream atlas_api {
    # TODO: apontar para o seu gunicorn
    # server 127.0.0.1:8000;

    # 💡 Para várias instâncias, repita a linha (round-robin por padrão).
    #    É assim que se faz "rolling update" com Nginx: tira uma do
    #    upstream, atualiza, devolve, repete.

    # 🔑 Reaproveita conexões com o backend — o mesmo motivo do
    #    `httpx.Client` do M07.
    keepalive 32;
}

# TODO: limite de taxa. Defina a zona no `http {}` do nginx.conf:
#   limit_req_zone $binary_remote_addr zone=atlas:10m rate=10r/s;
#
#   ⚠️ `$binary_remote_addr` é o IP REAL de quem conectou. Se houver
#      outro proxy na frente (Cloudflare, balanceador), use
#      `$http_x_forwarded_for` — mas só se você confiar nele.

# ───────────────────────── HTTP → HTTPS ─────────────────────────
server {
    listen 80;
    listen [::]:80;
    # TODO: seu domínio
    server_name atlas.aurora.com.br;

    # 🔑 O desafio do Let's Encrypt precisa vir por HTTP — se você
    #    redirecionar tudo, a renovação automática quebra e o
    #    certificado vence. Silenciosamente, 90 dias depois.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ───────────────────────── HTTPS ────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name atlas.aurora.com.br;

    # ── TLS ──
    # TODO: gerar com `sudo certbot --nginx -d atlas.aurora.com.br`
    # ssl_certificate     /etc/letsencrypt/live/atlas.aurora.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/atlas.aurora.com.br/privkey.pem;

    # 🔴 Nada de TLS 1.0/1.1 — quebrados há anos.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    # ⚠️ E CONFIRME que a renovação funciona:
    #      sudo certbot renew --dry-run
    #    "Site fora porque o certificado venceu" é um clássico, e
    #    sempre acontece de madrugada. Monitore a data de expiração.

    # ── Cabeçalhos de segurança (os mesmos do M06) ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY"    always;
    add_header Referrer-Policy           "no-referrer" always;

    # 🔴 Sem isto, alguém envia um corpo de 10 GB e enche o disco.
    client_max_body_size 10M;

    # ⚠️ Timeouts de LEITURA do cliente: é o que protege do cliente
    #    lento. O padrão de 60s é generoso demais.
    client_body_timeout   15s;
    client_header_timeout 15s;

    location / {
        # TODO: proxy_pass http://atlas_api;

        # 🔑 SEM ESTES QUATRO, a aplicação não sabe quem a chamou.
        #    São o `proxy_set_header` que o M09_01 demonstrou ao vivo.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        #                                  ↑ 🔴 sem este, a app acha
        #   que a conexão é http e gera redirecionamento para http://
        #   — causando aviso de conteúdo misto ou LAÇO INFINITO de
        #   redirecionamento. É um dos bugs de deploy mais confusos.

        # ⚠️ `proxy_read_timeout` precisa ser MAIOR que o timeout
        #    interno da aplicação. Se o Nginx cortar antes, você vê
        #    504 no navegador e NADA no log da app.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";      # habilita o keepalive

        # TODO: limit_req zone=atlas burst=20 nodelay;
    }

    # ── WebSocket (M07) ──
    # 🔑 Sem o `Upgrade`/`Connection`, o handshake falha com 400 e a
    #    mensagem não diz nada de útil.
    location /ws/ {
        # TODO: proxy_pass http://atlas_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;            # conexão longa por natureza
    }

    # ── Saúde: sem log, para não poluir ──
    location = /saude {
        # TODO: proxy_pass http://atlas_api;
        access_log off;
    }

    # TODO (decisão sua): esconder o /docs em produção?
    #
    #   💭 É segurança por obscuridade — vale pouco sozinho, mas reduz
    #      a superfície para varredura automatizada. NÃO substitui
    #      autenticação. Se as suas rotas exigem token (M06), expor o
    #      /docs é aceitável.
    #
    # location /docs { deny all; }
}
