      #       curl -X POST "${{ secrets.WEBHOOK_SLACK }}" \
      #         -d "{\"text\":\"deploy ${{ github.sha }}: ${{ job.status }}\"}"


# ═══════════════════════════════════════════════════════════════
#  💭 E se um segredo vazar no log?
#
#     ROTACIONE. Imediatamente.
#
#     Apagar o log NÃO basta: ele já foi indexado, pode ter sido
#     copiado, e em repositório público qualquer um leu. O único
#     conserto é invalidar a credencial e emitir outra.
#
#  🔒 MELHOR AINDA: OIDC.
#     Em vez de guardar uma chave de longa duração, o GitHub prova a
#     identidade do workflow para o provedor de nuvem, que devolve uma
#     credencial temporária. O segredo que não existe não pode vazar.
# ═══════════════════════════════════════════════════════════════
